services:
  openclaw-gateway:
    build: !reset null
    ports: !override
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:18789/healthz",
        ]
      timeout: 10s
      start_period: 5m
    volumes: !override
      - openclaw-state:/home/node/.openclaw
      - openclaw-auth:/home/node/.config/openclaw
  openclaw-cli:
    volumes: !override
      - openclaw-state:/home/node/.openclaw
      - openclaw-auth:/home/node/.config/openclaw

volumes:
  openclaw-state:
  openclaw-auth:
