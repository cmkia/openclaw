version: "3.8"

services:
  presentations:
    image: ${PRESENTATIONS_IMAGE}
    user: "1000:1000"
    init: true
    environment:
      WORKSPACE_DIR: /home/node/.openclaw/workspace
      PRESENTATIONS_API_KEY_FILE: /run/secrets/presentations_api_key
      TZ: America/Sao_Paulo
    volumes:
      - type: bind
        source: ${PRESENTATIONS_WORKSPACE_BIND}
        target: /home/node/.openclaw/workspace
    secrets:
      - source: presentations_api_key
        target: presentations_api_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      capabilities:
        aliases:
          - openclaw-${TENANT}-presentations
    cap_drop:
      - ALL
    stop_grace_period: 2m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${NODE_HOSTNAME}
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          memory: 256M
      labels:
        - traefik.enable=false
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 10s

secrets:
  presentations_api_key:
    external: true
    name: openclaw-${TENANT}-presentations-api-key-v1

networks:
  capabilities:
    external: true
    name: ${PRESENTATIONS_NETWORK}
