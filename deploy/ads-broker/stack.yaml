version: "3.8"

# Optional overlay for an existing tenant's complete, operator-owned stack.
services:
  gateway:
    secrets:
      - source: ads_api_key
        target: ads_api_key
        uid: "1000"
        gid: "1000"
        mode: 0400
  ads:
    image: ${ADS_IMAGE:?Set the pinned Ads adapter image}
    environment:
      ADS_API_KEY_FILE: /run/secrets/ads_api_key
      ADS_CREDENTIALS_FILE: /run/secrets/ads_credentials
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: America/Sao_Paulo
    secrets:
      - source: ads_api_key
        target: ads_api_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: ads_credentials
        target: ads_credentials
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      capabilities:
        aliases:
          - openclaw-${TENANT}-ads
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      labels:
        traefik.enable: "false"
        openclaw.capability: ads-reports
      placement:
        constraints:
          - node.hostname == ${NODE_HOSTNAME:?Set the deployment node}
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 2m
      restart_policy:
        condition: any
        delay: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  ads_api_key:
    external: true
    name: ${ADS_API_KEY_SECRET:?Set the tenant adapter key secret}
  ads_credentials:
    external: true
    name: ${ADS_CREDENTIALS_SECRET:?Set the private report credentials secret}
