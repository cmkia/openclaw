version: "3.8"

# CPU settings copied from the verified Erika service; storage and keys are tenant-owned.
services:
  docling:
    image: quay.io/docling-project/docling-serve-cpu@sha256:6eda9c524992147c1b0b06a1a9be4894bd68b1f43c86d92c32f996c4c60d18a3
    user: "1001:0"
    init: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export DOCLING_SERVE_API_KEY="$$(cat /run/secrets/docling_api_key)"
        test -n "$$DOCLING_SERVE_API_KEY"
        exec docling-serve run
    environment:
      UVICORN_WORKERS: "1"
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: "1"
      DOCLING_SERVE_SCRATCH_PATH: /var/lib/docling/scratch
      DOCLING_SERVE_MAX_FILE_SIZE: "536870912"
      DOCLING_SERVE_MAX_NUM_PAGES: "3000"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "14400"
      DOCLING_SERVE_OTEL_ENABLE_OTLP_METRICS: "false"
      DOCLING_SERVE_OTEL_ENABLE_TRACES: "false"
      HF_HOME: /opt/app-root/src/.cache/huggingface
    secrets:
      - source: docling_api_key
        target: docling_api_key
        uid: "1001"
        gid: "0"
        mode: 0400
    volumes:
      - docling-models:/opt/app-root/src/.cache
      - docling-scratch:/var/lib/docling/scratch
    networks:
      - capabilities
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${NODE_HOSTNAME}
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          memory: 1G
      labels:
        - traefik.enable=false
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 8m
      rollback_config:
        order: stop-first
        monitor: 8m
      restart_policy:
        condition: any
        delay: 10s

volumes:
  docling-models:
    external: true
    name: openclaw-${TENANT}-docling-models
  docling-scratch:
    external: true
    name: openclaw-${TENANT}-docling-scratch

secrets:
  docling_api_key:
    external: true
    name: openclaw-${TENANT}-docling-api-v1

networks:
  capabilities:
    external: true
    name: openclaw-${TENANT}-capabilities
